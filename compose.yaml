services:
  jenkins:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_OPTS: "--httpPort=8085"
      JENKINS_ADMIN_USER: "${JENKINS_ADMIN_USER:-admin}"
      REPO_URL: "${REPO_URL:?Укажите SSH URL репозитория в .env}"
      DELETE_FILES: "${DELETE_FILES:?Укажите один или два файла в .env}"
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-Sim}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-ci@tz.com}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./secrets:/run/ci-secrets:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/login"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  jenkins_home:
